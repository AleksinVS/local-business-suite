<button type="button" class="close-btn close-btn-global" onclick="closeWaitingListDrawer()">&times;</button>

<div class="drawer-header">
  <div class="header-main-info">
    <div class="header-meta">
      <span class="eyebrow">Лист ожидания</span>
    </div>
    <h2>{% if entry %}Редактирование{% else %}Новая запись{% endif %}</h2>
  </div>
</div>
<div class="drawer-content">
  <form id="waiting-list-form"
    hx-post="{% if entry %}{% url 'waiting_list:update' entry.pk %}{% else %}{% url 'waiting_list:create' %}{% endif %}"
    hx-target="#entry-detail-panel-content"
    hx-swap="innerHTML"
  >
    {% csrf_token %}
    {% include "waiting_list/partials/entry_form_fields.html" %}
  </form>
</div>
<div class="drawer-footer">
  {% if entry %}
    <button type="button" class="btn btn-ghost" 
            hx-get="{% url 'waiting_list:detail' entry.pk %}" 
            hx-target="#entry-detail-panel-content">Отмена</button>
  {% else %}
    <button type="button" class="btn btn-ghost" onclick="closeWaitingListDrawer()">Отмена</button>
  {% endif %}
  <button type="submit" form="waiting-list-form" class="btn btn-primary">{% if entry %}Сохранить{% else %}Добавить{% endif %}</button>
</div>
