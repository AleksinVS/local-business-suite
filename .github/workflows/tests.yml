name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  primary:
    name: Python 3.11 — quality and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run fast quality gates
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py validate_architecture_contracts

      - name: Run full tests without coverage on pull requests
        if: github.event_name == 'pull_request'
        run: python -m pytest --migrations

      - name: Run full tests with coverage on main
        if: github.event_name == 'push'
        run: >-
          python -m pytest --migrations
          --cov=apps
          --cov=services
          --cov-report=xml
          --cov-report=term:skip-covered

  compatibility:
    name: Python 3.12 — compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run unit compatibility tests on pull requests
        if: github.event_name == 'pull_request'
        run: python -m pytest -m unit --maxfail=1

      - name: Run full compatibility tests on main
        if: github.event_name == 'push'
        run: python -m pytest --migrations

  e2e-smoke:
    name: Browser smoke test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: primary

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Django and run smoke test
        run: |
          mkdir -p .local
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8001 --noreload > .local/e2e-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8001/health/ && break
            sleep 1
          done
          npm run test:e2e:smoke
