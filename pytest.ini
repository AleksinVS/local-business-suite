[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
testpaths = apps services
python_files = tests.py test_*.py *_tests.py
addopts = -q --tb=short --strict-markers
cache_dir = .local/pytest-cache
markers =
    unit: isolated test without database, browser or external service
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    serial: test must not run concurrently with shared filesystem or process state
