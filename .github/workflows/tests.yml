name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected contours
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      ui: ${{ steps.scope.outputs.ui }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths with fail-safe fallback
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [[ -z "$changed" ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          elif grep -Ev '^(docs/|workflow/|README\.md$|AGENTS\.md$|BACKLOG\.md$|PROJECT_STRUCTURE\.yaml$)' <<< "$changed" | grep -q .; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(templates/|static/|scripts/e2e/|apps/(ai|notifications|workorders|waiting_list)/|package(-lock)?\.json$)' <<< "$changed"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  primary:
    name: Python 3.11 — quality and tests
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run fast quality gates
        run: |
          make PYTHON=python check-fast
          python manage.py makemigrations --check --dry-run
          make PYTHON=python contracts

      - name: Run full tests without coverage on pull requests
        if: github.event_name == 'pull_request' && needs.changes.outputs.runtime == 'true'
        run: make PYTHON=python test

      - name: Run full tests with coverage on main
        if: github.event_name == 'push'
        run: >-
          make test
          PYTHON=python
          TEST_FLAGS="--cov=apps --cov=services --cov-report=xml --cov-report=term:skip-covered"

  compatibility:
    name: Python 3.12 — compatibility
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.runtime == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run unit compatibility tests on pull requests
        if: github.event_name == 'pull_request'
        run: make PYTHON=python test-unit TEST_FLAGS=--maxfail=1

      - name: Run full compatibility tests on main
        if: github.event_name == 'push'
        run: make PYTHON=python test

  e2e-smoke:
    name: Browser smoke test
    if: >-
      always() &&
      needs.primary.result == 'success' &&
      (github.event_name == 'push' || needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-latest
    needs: [changes, primary]
    env:
      E2E_USERNAME: ci-e2e
      E2E_PASSWORD: ci-e2e-ephemeral-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Django and run smoke test
        run: E2E_PYTHON=python bash scripts/e2e/run-smoke.sh
