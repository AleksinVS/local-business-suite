[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
testpaths = apps services
python_files = tests.py test_*.py *_tests.py
addopts = -q --tb=short --strict-markers -p config.pytest_plugin
cache_dir = .local/pytest-cache
markers =
    unit: isolated test without database, browser, process or external service
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: test using Django database, HTTP/view boundary or multiple runtime components
    serial: test must not run concurrently with shared filesystem or process state
