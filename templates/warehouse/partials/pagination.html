{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Страницы">
  {% if page_obj.has_previous %}<a href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}
  <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if query %}{{ query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Вперёд</a>{% endif %}
</nav>
{% endif %}
