<div class="drawer-header">
  <div>
    <h3>Новая заявка</h3>
    <h2>Заполните данные</h2>
  </div>
  <button type="button" class="close-btn" onclick="closeKanbanDrawer()">&times;</button>
</div>
<div class="drawer-content">
  <form id="workorder-create-form"
    hx-post="{% url 'workorders:create' %}"
    hx-target="#detail-panel-content"
    hx-swap="innerHTML"
  >
    {% csrf_token %}
    <input type="hidden" name="{{ form.board.html_name }}" value="{{ form.board.value|default_if_none:'' }}">
    <input type="hidden" name="return_view" value="{{ return_view|default:'board' }}">
    {{ form.board.errors }}
    <div class="form-grid">
      <div class="input-group full-width">
        <label for="{{ form.description.id_for_label }}">{{ form.description.label }}</label>
        {{ form.description }}
        {{ form.description.errors }}
      </div>
      <div class="input-group full-width">
        <label for="id_department_search">{{ form.department.label }}</label>
        <div
          class="workorder-autocomplete"
          data-workorder-autocomplete
          data-autocomplete-kind="department"
          data-autocomplete-url="{% url 'workorders:create_department_options' %}"
          data-autocomplete-required="true"
        >
          <input
            type="hidden"
            id="{{ form.department.id_for_label }}"
            name="{{ form.department.html_name }}"
            value="{{ form.department.value|default_if_none:'' }}"
            data-autocomplete-value
          >
          <input
            type="search"
            id="id_department_search"
            value="{{ selected_department_label }}"
            placeholder="Начните вводить название подразделения"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="department-autocomplete-options"
            data-autocomplete-input
            required
          >
          <div
            id="department-autocomplete-options"
            class="workorder-autocomplete-options"
            role="listbox"
            data-autocomplete-options
            hidden
          ></div>
        </div>
        {{ form.department.errors }}
      </div>
      <div class="input-group">
        <label for="{{ form.priority.id_for_label }}">{{ form.priority.label }}</label>
        {{ form.priority }}
        {{ form.priority.errors }}
      </div>
      <div class="input-group full-width">
        <label for="id_device_search">{{ form.device.label }}</label>
        <div
          class="workorder-autocomplete"
          data-workorder-autocomplete
          data-autocomplete-kind="device"
          data-autocomplete-url="{% url 'workorders:create_device_options' %}"
        >
          <input
            type="hidden"
            id="{{ form.device.id_for_label }}"
            name="{{ form.device.html_name }}"
            value="{{ form.device.value|default_if_none:'' }}"
            data-selected-department-id="{{ selected_device_department_id }}"
            data-autocomplete-value
          >
          <input
            type="search"
            id="id_device_search"
            value="{{ selected_device_label }}"
            placeholder="Название, инвентарный или серийный номер"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="device-autocomplete-options"
            data-autocomplete-input
          >
          <div
            id="device-autocomplete-options"
            class="workorder-autocomplete-options"
            role="listbox"
            data-autocomplete-options
            hidden
          ></div>
        </div>
        {{ form.device.errors }}
      </div>
    </div>
  </form>
</div>
<div class="drawer-footer">
  <button type="button" class="btn btn-ghost" onclick="closeKanbanDrawer()">Отмена</button>
  <button type="submit" form="workorder-create-form" class="btn btn-primary">Создать</button>
</div>
